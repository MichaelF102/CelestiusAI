[project]
name = "celestiusai"
version = "0.1.0"
description = "CelestiusAI - Data Analyst and Data Scientist: an AI-assisted analytics and machine-learning workspace, from raw data to validated insights and deployed models."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CelestiusAI Team" }
]
dependencies = [
    "joblib>=1.3.0",
    "streamlit>=1.43.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "numpy>=1.26.0,<3.0.0",
    "scipy>=1.12.0,<2.0.0",
    "statsmodels>=0.14.0,<1.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    "plotly>=5.20.0,<6.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "reportlab>=4.0.0,<6.0.0",
]

[project.optional-dependencies]
llm = [
    "google-genai>=1.0.0,<3.0.0",
]
claude = [
    "anthropic>=0.40.0",
]
ml = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "optuna>=3.5",
    "shap>=0.45",
]
sql = [
    "sqlalchemy>=2.0",
    "pandas-gbq>=0.22",
]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.4.0,<1.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # Line length handled by formatter
    "B008",  # Do not perform function call in argument defaults (standard in some UI contexts)
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
